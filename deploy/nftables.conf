# Phase 5A — قالب nftables (artifact داخل Git — يُطبق في 5B فقط).
#
# شرطا التطبيق الإلزاميان (وثيقة التصميم §6):
#   1. توثيق subnet LAN الفعلية أولاً واستبدال <LAN_SUBNET>/<ADMIN_SUBNET>.
#   2. تطبيق مؤقت مؤمَّن: قاعدة معاكسة جاهزة + مهلة فك تلقائية (at/sleep)
#      عبر جلسة SSH نشطة — ضمان عدم فقدان الوصول للخادم.

table inet ifrs_filter {
  chain input {
    type filter hook input priority 0; policy drop;

    iif "lo" accept
    ct state established,related accept

    # Caddy فقط من subnet LAN الموثقة
    ip saddr <LAN_SUBNET> tcp dport 443 accept
    ip saddr <LAN_SUBNET> tcp dport 80 accept     # تحويل إلى HTTPS فقط

    # SSH إداري — من مضيف/شبكة إدارة محددة
    ip saddr <ADMIN_SUBNET> tcp dport 22 accept

    counter log prefix "ifrs-drop: " drop
  }
}
